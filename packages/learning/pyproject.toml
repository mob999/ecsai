[project]
name = "edge-sim-learning"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "edge-sim", "benchmarl==1.5.2", "torch==2.9.1", "torchvision==0.24.1",
  "torchrl==0.10.1", "tensordict==0.10.0", "pettingzoo==1.25.0",
  "gymnasium==1.2.2", "numpy>=2,<3", "wandb==0.23.1", "psutil>=6,<8",
]
[project.scripts]
edge-learn = "edge_sim_learning.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/edge_sim_learning"]
