[project]
name = "edge-sim"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["edge-sim-simgrid", "edge-sim-models", "pyarrow>=18,<24", "pydantic-settings>=2.7,<3"]

[project.scripts]
edge-sim = "edge_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_sim"]
